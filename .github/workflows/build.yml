name: Build

on:
  push:
  pull_request:
    branches:
    - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: CloudSecurity Build
    permissions:
      contents: read
      # required for the tokenless Codecov upload via OpenID Connect
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Configure Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '25'
        cache: 'maven'
    - name: Build with Maven
      run: mvn -B package --file pom.xml
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        use_oidc: true
        files: ./standalone-client/target/site/jacoco/jacoco.xml,./config-client/target/site/jacoco/jacoco.xml,./config-client-vault/target/site/jacoco/jacoco.xml,./config-server/target/site/jacoco/jacoco.xml,./config-server-vault/target/site/jacoco/jacoco.xml
        fail_ci_if_error: true
